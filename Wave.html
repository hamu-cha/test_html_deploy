<!doctype html>
<meta charset="utf-8">
<div>
  <div>
    <label>振幅 <input id="amp" type="range" min="0.1" max="1.5" step="0.1" value="1"> <span id="ampValue"></span> m</label>
  </div>
  <div>
    <label>波長 <input id="lambda" type="range" min="0.5" max="4" step="0.1" value="2"> <span id="lambdaValue"></span> m</label>
  </div>
  <div>
    <label>周期 <input id="period" type="range" min="0.5" max="4" step="0.1" value="2"> <span id="periodValue"></span> 秒</label>
  </div>
  <div>速さ <span id="speedValue"></span> m/s</div>
</div>
<svg width="800" height="370" font-size="22pt">
  <g id="grid"></g>
  <line x1="90" y1="190" x2="710" y2="190" stroke="black" stroke-width = "2"/>
  <line x1="90" y1="30" x2="90" y2="350" stroke="black" stroke-width = "2"/>
  <g id="yTicks"></g>
  <g id="hTicks"></g>
  <text x="100" y="28">y [m]</text>
  <text x="716" y="200">x [m]</text>
  <polyline id="moving1" fill="none" stroke="lightgreen" stroke-width="10"/>
  <g id="dots"></g>
</svg>
<div>
  <button id = back>back</button>
  <button id = startstop>start/stop</button>
  <button id = next>next</button>
  <button id = reset>reset</button>
</div>
<script>
  const moving1 = document.getElementById('moving1');
  const ampInput = document.getElementById('amp');
  const lambdaInput = document.getElementById('lambda');
  const periodInput = document.getElementById('period');
  const ampValue = document.getElementById('ampValue');
  const lambdaValue = document.getElementById('lambdaValue');
  const periodValue = document.getElementById('periodValue');
  const speedValue = document.getElementById('speedValue');
  const pxPerM = 100;
  const originX = 90;
  const originY = 190;
  let isRunning = false;
  let phase = 0;
  let prevMs = 0;
  const step = 1 / 8;
  const formatSig = v => (v === 0 || Math.abs(v) >= 100) ? String(v) : v.toPrecision(2);

  let gridSvg = '';
  for (let x = 0; x <= 6; x += 0.5) {
    const px = originX + x * pxPerM;
    gridSvg += `<line x1="${px}" y1="${originY - 1.5 * pxPerM}" x2="${px}" y2="${originY + 1.5 * pxPerM}" stroke="lightgray"/>`;
  }
  for (let y = -1.5; y <= 1.5; y += 0.5) {
    const py = originY - y * pxPerM;
    gridSvg += `<line x1="${originX}" y1="${py}" x2="${originX + 6 * pxPerM}" y2="${py}" stroke="lightgray"/>`;
  }
  document.getElementById('grid').innerHTML = gridSvg;

  let yTickSvg = '';
  for (const v of [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5]) {
    const py = originY - v * pxPerM;
    yTickSvg += `<line x1="${originX - 5}" y1="${py}" x2="${originX + 5}" y2="${py}" stroke="black"/>`;
    yTickSvg += `<text x="${originX - 8}" y="${py + 10}" text-anchor="end">${formatSig(v)}</text>`;
  }
  document.getElementById('yTicks').innerHTML = yTickSvg;

  let hTickSvg = '';
  for (let n = 0; n <= 6; n++) {
    const px = originX + n * pxPerM;
    hTickSvg += `<line x1="${px}" y1="${originY - 5}" x2="${px}" y2="${originY + 5}" stroke="black"/>`;
    if (n !== 0) hTickSvg += `<text x="${px}" y="${originY + 38}" text-anchor="middle">${formatSig(n)}</text>`;
  }
  document.getElementById('hTicks').innerHTML = hTickSvg;

  const dots = [];
  for (let x = 0; x <= 600; x += 0.5 * pxPerM) {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', originX + x);
    circle.setAttribute('r', 5);
    circle.setAttribute('fill', 'green');
    document.getElementById('dots').appendChild(circle);
    dots.push({ x, circle });
  }

  document.getElementById('startstop').addEventListener('click', () => {
    isRunning = !isRunning;
  });
  document.getElementById('next').addEventListener('click', () => {
    isRunning = false;
    phase = (Math.floor(phase / step + 1e-9) + 1) * step;
  });
  document.getElementById('back').addEventListener('click', () => {
    isRunning = false;
    phase = Math.max(0, (Math.ceil(phase / step - 1e-9) - 1) * step);
  });
  document.getElementById('reset').addEventListener('click', () => {
    isRunning = false;
    phase = 0;
  });

  function draw(ms) {
    const A = Number(ampInput.value);
    const lambda = Number(lambdaInput.value);
    const T = Number(periodInput.value);
    ampValue.textContent = formatSig(A);
    lambdaValue.textContent = formatSig(lambda);
    periodValue.textContent = formatSig(T);
    speedValue.textContent = (lambda / T).toFixed(2);

    if (isRunning) phase += (ms - prevMs) / 1000 / T;
    prevMs = ms;
    const pts1 = [];
    const front = lambda * phase * pxPerM;
    const waveY = x => x > front ? 0 : A * pxPerM * Math.sin(2 * Math.PI * (x / pxPerM / lambda - phase));
    for (let x = 0; x <= 600; x++) {
      pts1.push(`${originX + x},${originY - waveY(x)}`);
    }
    moving1.setAttribute('points', pts1.join(' '));

    for (const { x, circle } of dots) {
      circle.setAttribute('cy', originY - waveY(x));
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
